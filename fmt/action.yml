name: "Qlty Fmt"
description: "Auto-format your code with Qlty CLI"
author: "Qlty"

branding:
  icon: "loader"
  color: "green"

inputs:
  github-token:
    description: "GitHub token for sigstore attestation verification"
    required: false
    default: ${{ github.token }}

  commit:
    description: "Commit changes after fmt"
    required: false
    default: "false"

  telemetry:
    description: >-
      Send Qlty an error report when the step fails. A report holds the
      error's type, the kind of failure, the Qlty CLI's exit code and the
      outcome of its attestation check, never the CLI's output. Set to false
      to send nothing; this also sets QLTY_TELEMETRY=off for the Qlty CLI.
    required: false
    default: true

runs:
  using: node24
  main: dist/index.js
