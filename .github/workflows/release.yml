name: Release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: write
jobs:
  release:
    # Publishing a release starts with a maintainer pushing a version tag
    # (vX.Y.Z) to the commit that prepared it; the "Only maintainers manage
    # tags" ruleset restricts who can do that. Merging a release pull request
    # only lands the version bump and changelog entry on the default branch.
    #
    # This workflow never creates or moves tags. It verifies that the tagged
    # commit is on the default branch and agrees with the package.json
    # versions and CHANGELOG.md, publishes the GitHub release for the tag,
    # and announces it. The floating major tag (vN) is moved by the
    # maintainer as well; the workflow only warns when it does not point at
    # the release.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # version 4.2.2
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./coverage/package.json').version")
          FMT_VERSION=$(node -p "require('./fmt/package.json').version")

          if [ "$PACKAGE_VERSION" != "$FMT_VERSION" ]; then
            echo "Error: coverage/package.json ($PACKAGE_VERSION) and fmt/package.json ($FMT_VERSION) disagree"
            exit 1
          fi

          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: tag ${TAG} does not match the version in package.json (${PACKAGE_VERSION})"
            echo "Tag the commit that prepared release v${PACKAGE_VERSION}, or delete this tag"
            exit 1
          fi

          # The newest semver tag other than the one being released
          PREVIOUS_TAG=$(git tag --list 'v*' --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "${TAG}" | head -n1)

          echo "Releasing version: $VERSION (previous release: $PREVIOUS_TAG)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_version=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "full_changelog_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify the tagged commit is on the default branch
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --quiet origin "${DEFAULT_BRANCH}"
          RELEASE_SHA=$(git rev-parse HEAD)

          if ! git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD; then
            echo "Error: ${TAG} points at ${RELEASE_SHA}, which is not on ${DEFAULT_BRANCH}"
            echo "Releases may only be cut from reviewed history on the default branch"
            exit 1
          fi

          echo "${TAG} points at ${RELEASE_SHA}, which is on ${DEFAULT_BRANCH}"

      - name: Validate CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking for version $VERSION in CHANGELOG.md"

          # Check if version exists in CHANGELOG.md
          if ! grep -q "^## v${VERSION}" CHANGELOG.md; then
            echo "Error: Version v${VERSION} not found in CHANGELOG.md"
            echo "Please add a changelog entry for v${VERSION} before releasing"
            exit 1
          fi

          echo "Found changelog entry for v${VERSION}"

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract the changelog section for this version.
          # Start from the version header and continue until the next version header
          # or end of file.
          CHANGELOG_CONTENT=$(awk "/^## v${VERSION}/{flag=1; next} /^## v[0-9]/{flag=0} flag" CHANGELOG.md)

          if [ -z "$CHANGELOG_CONTENT" ]; then
            echo "Warning: No changelog content found for v${VERSION}"
            CHANGELOG_CONTENT="Release v${VERSION}"
          fi

          # Write to file to preserve formatting
          echo "$CHANGELOG_CONTENT" > changelog_content.txt

          echo "Extracted changelog content:"
          cat changelog_content.txt

      - name: Check for changes after release preparation
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"

          # The release was prepared by the commit that last changed the
          # version line, i.e. the merged "Prepare release" pull request
          PREPARED_SHA=$(git blame --porcelain -L '/"version":/,+1' -- coverage/package.json | head -n1 | cut -d' ' -f1)

          if [ -z "$PREPARED_SHA" ]; then
            echo "::warning::Could not find the commit that set version ${VERSION}; skipping staleness check"
            exit 0
          fi

          MISSED=$(git log --oneline --first-parent "${PREPARED_SHA}..HEAD")

          if [ -n "$MISSED" ]; then
            echo "::warning::Commits landed after this release was prepared. Verify the changelog covers them:"
            echo "$MISSED"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists; leaving it as is"
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file changelog_content.txt \
            --verify-tag

      - name: Check the major version tag
        env:
          TAG: ${{ github.ref_name }}
          MAJOR_TAG: v${{ steps.version.outputs.major_version }}
        run: |
          RELEASE_SHA=$(git rev-parse HEAD)

          if git fetch --quiet --force origin "refs/tags/${MAJOR_TAG}:refs/tags/${MAJOR_TAG}" 2> /dev/null; then
            MAJOR_SHA=$(git rev-parse "${MAJOR_TAG}^{commit}")
          else
            MAJOR_SHA=""
          fi

          if [ "$MAJOR_SHA" = "$RELEASE_SHA" ]; then
            echo "${MAJOR_TAG} points at ${TAG}"
            exit 0
          fi

          echo "::warning::${MAJOR_TAG} does not point at ${TAG} (currently ${MAJOR_SHA:-unset}). Move it with: git tag -f ${MAJOR_TAG} ${TAG} && git push --force origin ${MAJOR_TAG}"

      - name: Compose Slack announcement
        id: compose
        run: |
          cat > slack_announcement.json <<'EOF'
          {
            "text": ":rocket: qlty-action <${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}|v${{ steps.version.outputs.version }}> released (previous version: ${{ steps.version.outputs.previous_tag }})",
            "attachments": [
              {
                "color": "#2eb886",
                "blocks": [
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "<${{ steps.version.outputs.full_changelog_url }}|full changelog>"
                      }
                    ]
                  }
                ]
              }
            ]
          }
          EOF

          cat slack_announcement.json

      - name: Announce release to Slack (#feed-deploys)
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack_announcement.json
