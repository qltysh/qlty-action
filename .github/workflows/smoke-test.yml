name: Smoke Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies (workspace root)
        run: npm ci --ignore-scripts

      - name: Test
        working-directory: ./coverage
        run: npm run coverage

      - name: Upload coverage
        uses: ./coverage
        with:
          oidc: true
          files: coverage/coverage/clover.xml
          incomplete: true
          skip-errors: false

      - name: Complete coverage
        uses: ./coverage
        with:
          oidc: true
          command: complete
          skip-errors: false

      - name: Run fmt action
        uses: ./fmt

  test-install-without-token-permissions:
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Qlty CLI
        uses: ./install

      - name: Run Qlty CLI
        run: qlty --version

  test-install-in-container-without-gh:
    runs-on: ubuntu-latest
    container: debian:13-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install xz for the CLI archive
        run: apt-get update -qq && apt-get install -y -qq xz-utils

      - name: Install Qlty CLI
        uses: ./install

      - name: Run Qlty CLI
        run: qlty --version

  test-install-on-hosted-runners:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Qlty CLI
        uses: ./install

      - name: Run Qlty CLI
        run: qlty --version
