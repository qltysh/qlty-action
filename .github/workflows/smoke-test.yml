name: Smoke Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies (workspace root)
        run: npm ci --ignore-scripts

      - name: Test
        working-directory: ./coverage
        run: npm run coverage

      - name: Upload coverage
        uses: ./coverage
        with:
          oidc: true
          files: coverage/coverage/clover.xml
          incomplete: true
          skip-errors: false

      - name: Complete coverage
        uses: ./coverage
        with:
          oidc: true
          command: complete
          skip-errors: false

      - name: Run fmt action
        uses: ./fmt

  test-install-without-token-permissions:
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Qlty CLI
        uses: ./install

      - name: Run Qlty CLI
        run: qlty --version

  test-install-in-container-without-gh:
    runs-on: ubuntu-latest
    container: debian:13-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install xz for the CLI archive
        run: apt-get update -qq && apt-get install -y -qq xz-utils

      - name: Check that gh is not installed
        run: |
          if command -v gh; then
            echo "::error::gh is installed, so this job no longer tests verification without it"
            exit 1
          fi

      # The install fails unless the attestation verifies, so this job passing
      # means the action verified the CLI without gh. true is the default; it
      # is set here so the job keeps testing verification if that changes.
      - name: Install Qlty CLI
        uses: ./install
        with:
          verify-attestation: true

      - name: Run Qlty CLI
        run: qlty --version

  test-install-without-verification:
    runs-on: ubuntu-latest
    container: debian:13-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install xz for the CLI archive
        run: apt-get update -qq && apt-get install -y -qq xz-utils

      - name: Block the hosts verification needs
        run: echo "127.0.0.1 api.github.com tuf-repo-cdn.sigstore.dev" >> /etc/hosts

      - name: Install Qlty CLI with verification on
        id: verified
        continue-on-error: true
        uses: ./install

      - name: Check that the install failed closed
        env:
          OUTCOME: ${{ steps.verified.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::The install finished without reaching api.github.com, so it could not have verified the Qlty CLI"
            exit 1
          fi

      - name: Install Qlty CLI with verification off
        uses: ./install
        with:
          verify-attestation: false

      - name: Run Qlty CLI
        run: qlty --version

  test-install-on-macos-and-windows:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Qlty CLI
        uses: ./install

      - name: Run Qlty CLI
        run: qlty --version

  # The required status check on main. List every job in this workflow under
  # `needs`. `always()` keeps this job from being skipped, because GitHub
  # counts a skipped required check as passing.
  smoke-tests-passed:
    if: ${{ always() }}
    needs:
      - test-coverage
      - test-install-without-token-permissions
      - test-install-in-container-without-gh
      - test-install-without-verification
      - test-install-on-macos-and-windows
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Check that every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A job in this workflow finished with: $result"
              exit 1
            fi
          done
